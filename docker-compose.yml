
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET="${JWT_SECRET_KEY:-aCRXQICGee4xm3092CammuN+oFKKKB17JnCTES6lqfc}"
      - DATASOURCE_URL=jdbc:postgresql://db:5432/oslo_toilet
      - USERNAME=${DB_USERNAME:-postgres}
      - PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=oslo_toilet
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
